-boss-label b{font-size:11px;font-weight:400;color:#798b97;display:block;margin-top:7px}.game-footer{display:flex;justify-content:space-between;gap:15px;padding:18px 0 24px;align-items:center;color:#708592;font-size:10px}.controls{display:flex;gap:15px;flex-wrap:wrap}.controls>span{display:flex;align-items:center;gap:4px}kbd{font:9px GameMono,monospace;padding:3px 4px;min-width:18px;text-align:center;border:1px solid #30404d;color:#afbdc5;background:#101a24;border-radius:2px}#footerHint{white-space:nowrap;font-size:10px;letter-spacing:.02em}.modal{position:absolute;inset:0;z-index:5;background:#060b12d9;backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;padding:30px;overflow:auto}.modal[hidden],.start-screen[hidden]{display:none}.modal-content{width:min(940px,100%);max-height:100%;overflow:auto;padding:6px}.modal-content.narrow{max-width:530px;background:#101a24;border:1px solid #32414c;padding:30px}.modal-eyebrow{color:var(--cyan);font:10px GameMono,monospace;letter-spacing:.14em;margin:0 0 9px}.modal h2{font-size:27px;font-weight:650;letter-spacing:-.04em;margin:0 0 10px}.modal-copy{font-size:12px;color:#96aab5;line-height:1.8;margin:0 0 18px}.reward-top{display:flex;justify-content:space-between;gap:20px;align-items:end}.reward-next{font:10px GameMono,monospace;color:#adbdc7;text-align:right;line-height:1.8}.reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 13px}.reward-card{position:relative;min-height:270px;text-align:left;padding:20px 18px 16px;background:#111f2b;border-color:#314654;display:flex;flex-direction:column;gap:10px}.reward-card:hover{border-color:var(--cyan);background:#162b34;transform:translateY(-3px)}.card-index{font:10px GameMono,monospace;letter-spacing:.15em;color:#6e8795}.card-level{float:right;color:var(--cyan)}.reward-card h3{margin:4px 0 0;font-size:20px;font-weight:600}.card-description{font-size:11px;line-height:1.75;color:#b6c6ce;margin:0;min-height:57px}.burden-block{bord <body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="FAULTLINE 처음 화면"><span class="brand-mark">⌁</span><span>FAULTLINE<small>단층</small></span></a>
      <div class="run-status"><span class="status-dot"></span><span id="runStatus">RUN / 대기 중</span></div>
      <nav class="tools" aria-label="설정">
        <button id="buildBtn" type="button" title="현재 빌드">빌드 <span id="buildCount">00</span></button>
        <button id="soundBtn" type="button" aria-pressed="true">소리 ON</button>
        <button id="motionBtn" type="button" aria-pressed="false">효과 기본</button>
        <button id="pauseBtn" type="button" title="P / Esc">Ⅱ <span>일시정지</span></button>
      </nav>
    </header>

    <section class="surface" aria-label="게임 영역">
      <canvas id="gameCanvas" width="1100" height="680" tabindex="0" aria-label="블록 전투 게임 보드. 방향키로 이동, Z와 X로 회전, 스페이스로 즉시 낙하합니다."></canvas>
      <div id="liveStatus" class="sr-only" aria-live="polite"></div>
      <section id="startScreen" class="start-screen">
        <div class="intro">
          <div class="eyebrow"><span></span> BLOCK COMBAT / ROGUELIKE</div>
          <h1>FAULT<span>LINE</span></h1>
          <p class="intro-ko">단층</p>
          <p class="intro-copy">지운 줄이 공격이 된다.<br>아홉 번의 선택을 쌓아, 열 번째 구역을 돌파하라.</p>
          <div class="intro-facts"><span><b>10</b> 구역</span><span><b>09</b> 누적 선택</span><span><b>01</b> 생존 기회</span></div>
          <div class="start-actions"><button id="startBtn" class="primary" type="button">런 시작 <span>↗</span></button><button id="helpBtn" class="secondary" type="button">조작과 규칙</button></div>
          <label class="seed-label" for="seedInput">RUN SEED <input id="seedInput" maxlength="32" placeholder="비우면 무작위" autocomplete="off" spellcheck="false"></label>
          <button id="recordsBtn" class="text-button" type="button">이 기기의 기록 보기 <span>→</span></button>
        </div>
        <div class="intro-boss-label"><span>UNKNOWN STRUCTURE</span><b>침묵은 오래가지 않는다.</b></div>
      </section>
      <div id="modal" class="modal" hidden>
        <section id="modalContent" class="modal-content" aria-modal="true" role="dialog" aria-label="게임 메뉴"></section>
      </div>
      <div id="toast" class="toast" aria-live="polite"></div>
    </section>

    <footer class="game-footer">
      <div class="controls"><span><kbd>←</kbd><kbd>→</kbd> 이동</span><span><kbd>Z</kbd><kbd>X</kbd> 회전</span><span><kbd>SPACE</kbd> 즉시 낙하</span><span><kbd>C</kbd> 홀드</span><span><kbd>↓</kbd> 빠른 낙하</span></div>
      <span id="footerHint">정규 런 · 사망 시 전부 초기화</span>
    </footer>
    <div class="touch-controls" aria-label="터치 조작">
      <button data-act="left" aria-label="왼쪽">←</button><button data-act="ccw" aria-label="반시계 회전">↶</button><button data-act="cw" aria-label="시계 회전">↷</button><button data-act="right" aria-label="오른쪽">→</button><button data-act="hold">HOLD</button><button data-act="drop">DROP</button>
    </div>
  </main>
  <script>
const Core=(()=>{
/** Deterministic, renderer-independent rules for FAULTLINE. */
const WIDTH = 10;
const HEIGHT = 20;
const RULES_VERSION = '0.1.1';

const round = n => Math.floor(n + 0.5);
const emptyRow = () => Array(WIDTH).fill(null);
const rankMap = defs => Object.fromEntries(Object.keys(defs).map(k => [k, 0]));

const UPGRADES = {
  single: { label: '단일 집중', max: 3, description: r => `1줄 제거 피해 +${40*r}%` },
  middle: { label: '중간 정리', max: 3, description: r => `2~3줄 제거 피해 +${20*r}%` },
  compress: { label: '압축 타격', max: 3, description: r => `4줄 제거 피해 +${35*r}%` },
  repeat: { label: '연속 압축', max: 3, description: r => `연속 4줄 제거 피해 +${25*r}%. 사이의 비제거는 허용` },
  combo: { label: '연쇄 증폭', max: 3, description: r => `연쇄 단계당 보너스 ${15+4*r}%. 최대 5단계 추가` },
  grace: { label: '연쇄 유예', max: 1, description: () => '한 연쇄에서 비제거 고정 1회 허용. 제거할 때마다 회복되지 않음' },
  charge: { label: '비제거 충전', max: 3, description: r => `비제거마다 전하 1. 최대 4개, 전하당 피해 ${3+r}` },
  convert: { label: '전환', max: 3, description: r => `3연쇄 이상 종료 시 ⌊연쇄/2⌋+${r-1} 전하 획득` },
  high: { label: '고도', max: 3, description: r => `제거 직전 최고 높이 12 이상이면 피해 +${35*r}%` },
  low: { label: '저상', max: 3, description: r => `제거 직전 최고 높이 6 이하면 피해 +${15*r}%` },
  opening: { label: '개시', max: 3, description: r => `각 전투의 첫 두 제거에 고정 피해 +${6*r}` },
  repair: { label: '수복', max: 3, description: r => `전투당 ${r}회, 2~3줄 제거 시 방해 1행 추가 정리 (6고정 간격)` }
};

const BURDENS = {
  vitality: { label: '증식', max: 3, description: r => `이후 보스 최대 체력 +${8*r}%` },
  dampen: { label: '감쇠', max: 3, description: r => `전체 공격 피해 -${4*r}%` },
  haste: { label: '조급', max: 3, description: r => `보스 공격 주기 ${r}고정 단축. 노출 기회도 달라짐` },
  erosion: { label: '침식', max: 3, description: r => `각 전투 첫 ${r}회 고정 뒤 방해 행 1개씩 추가` },
  regen: { label: '재생', max: 3, description: r => `보스 공격 뒤 최대 체력의 ${0.5*r}% 회복` },
  rigidity: { label: '경직', max: 3, description: r => `고정 유예 ${500-35*r}ms (기준 500ms)` }
};

const STAGES = [
  { name: '접촉', hp:150, gravity:1, K:9, rows:1, response:false, armor:false, stagger:false, T:60 },
  { name: '변위', hp:210, gravity:1.25, K:9, rows:1, response:false, armor:false, stagger:false, T:60 },
  { name: '간섭', hp:280, gravity:1.5, K:9, rows:2, response:true, armor:false, stagger:false, T:60 },
  { name: '차폐', hp:360, gravity:2, K:8, rows:1, response:false, armor:true, stagger:false, T:64 },
  { name: '단층', hp:460, gravity:2.5, K:9, rows:2, response:false, armor:false, stagger:true, T:64 },
  { name: '압력', hp:580, gravity:3, K:8, rows:2, response:true, armor:false, stagger:false, T:64 },
  { name: '위상', hp:720, gravity:4, K:8, rows:2, response:false, armor:true, stagger:false, T:72 },
  { name: '균열', hp:880, gravity:5, K:8, rows:2, response:true, armor:false, stagger:true, T:72 },
  { name: '임계', hp:1080, gravity:6, K:8, rows:2, response:true, armor:true, stagger:true, T:72 },
  { name: '특이점', hp:1600, gravity:8, K:8, rows:2, response:false, armor:false, stagger:false, T:96 }
];

const BASE = {
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
  T: [[1,0],[0,1],[1,1],[2,1]]
};
const rotateShape = points => points.map(([x,y]) => [2-y,x]);
const SHAPES = {
  I: [
    [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]],
    [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]]
  ],
  O: Array.from({length:4},()=>[[1,0],[2,0],[1,1],[2,1]])
};
for (const [type, points] of Object.entries(BASE)) {
  SHAPES[type] = [points];
  for (let i=1;i<4;i++) SHAPES[type].push(rotateShape(SHAPES[type][i-1]));
}
function cells(piece) {
  if (!piece) return [];
  return SHAPES[piece.type][piece.rotation].map(([x,y])=>[x+piece.x,y+piece.y]);
}

// Standard SRS kick tables; Y below is positive upward and is inverted at use.
const KICKS = {
  '0>1': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
  '1>0': [[0,0],[1,0],[1,-1],[0,2],[1,2]],
  '1>2': [[0,0],[1,0],[1,-1],[0,2],[1,2]],
  '2>1': [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],

  const card=e.target.closest('[data-choice]');if(card){choose(Number(card.dataset.choice));return;}
  const button=e.target.closest('[data-ui]');if(!button)return;
  const actions={resume,close:closeModal,build:showBuild,records:showRecords,result:showResult,retry:()=>startRun(game.seed),new:()=>startRun(''),home:goHome,abandon:()=>{modal('<p class="modal-eyebrow">ABANDON RUN</p><h2>이 런을 끝낼까요?</h2><p class="modal-copy">현재 보드와 모든 누적 선택이 사라집니다.</p><div class="modal-actions"><button class="danger" data-ui="home">런 끝내기</button><button class="primary" data-ui="resume">계속하기</button></div>','abandon',true);}};
  actions[button.dataset.ui]?.();
});
for(const button of document.querySelectorAll('[data-act]')){
  button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);audio.unlock();const a=button.dataset.act;if(a==='left'||a==='right'){direction=a==='left'?-1:1;dirAge=0;dirRepeats=0;}act(a);});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,()=>{direction=0;dirAge=0;dirRepeats=0;});
}
updateUi();requestAnimationFrame(frame);

})();
</script>
</body>
</html>
